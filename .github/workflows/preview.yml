name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ github.event.pull_request.number }}
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        
      - name: Create Preview Branch
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git checkout -b pr-preview-${{ github.event.pull_request.number }}
          mkdir -p previews/pr-${{ github.event.pull_request.number }}
          cp -r dist/* previews/pr-${{ github.event.pull_request.number }}/
          git add previews/
          git commit -m "chore: update preview for PR #${{ github.event.pull_request.number }}"
          git push -f origin pr-preview-${{ github.event.pull_request.number }}
          
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = 'https://aroller.github.io/better-bridgeway-builder/previews/pr-${{ github.event.pull_request.number }}/';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📝 Preview deployment is ready!\nYou can view it here: ${previewUrl}`
            }); 